<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CrumbSave — вечерние наборы еды рядом с вами</title>
  <meta name="description" content="Находите кафе, пекарни и магазины рядом и бронируйте вечерние наборы еды по сниженной цене.">
  <meta name="theme-color" content="#1f5750">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://overpass.openstreetmap.fr" crossorigin>
  <script>
  // Предзагрузка заведений центра Алматы, пока грузится остальной JS
  (function () {
    try {
      if (sessionStorage.getItem('cs_loc') || sessionStorage.getItem('cs_radius')) return;
      var c = JSON.parse(localStorage.getItem('cs_ov_43.239_76.890_2000') || 'null');
      if (c && Date.now() - c.t < 6 * 3600 * 1000) return;
      var a = '(around:2000,43.238949,76.889709)';
      var q = '[out:json][timeout:20];(nwr["amenity"~"^(cafe|restaurant|fast_food)$"]["name"]' + a + ';nwr["shop"~"^(bakery|pastry|confectionery|supermarket|convenience|greengrocer)$"]["name"]' + a + ';);out center 250;';
      var body = 'data=' + encodeURIComponent(q);
      window.__csPrefetch = { body: body, promise: fetch('https://overpass.openstreetmap.fr/api/interpreter', { method: 'POST', body: body, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } })
        .then(function (r) { return r.ok ? r.json() : null; }).then(function (j) { return j && j.elements; }).catch(function () { return null; }) };
    } catch (e) { /* ignore */ }
  })();
  </script>
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  <link rel="stylesheet" href="css/app.css?v=20261116h">
  <script src="config.js?v=20261116h"></script>
  <script type="module" src="js/app.js?v=20261116h"></script>
</head>
<body class="bg-canvas">
  <div id="root">
    <div class="mx-auto max-w-6xl p-6" aria-hidden="true"><div class="h-9 w-48 skel rounded-full mb-6"></div>
      <div class="grid gap-5 md:grid-cols-2 lg:grid-cols-3"><div class="aspect-[16/10] skel rounded-[18px]"></div><div class="aspect-[16/10] skel rounded-[18px]"></div><div class="aspect-[16/10] skel rounded-[18px]"></div></div></div>
  </div>
  <noscript><p style="padding:24px">Для работы CrumbSave нужен JavaScript.</p></noscript>
</body>
</html>
